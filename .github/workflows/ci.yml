name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Preprocess data (downloads MovieLens 100K)
        run: python -m data.preprocess

      - name: Run unit tests
        run: pytest tests/test_smoke.py -v
        # test_api_integration.py is skipped automatically here -- it needs
        # a live `uvicorn` server, which this workflow doesn't start.

      - name: Byte-compile check (catches syntax errors across the repo)
        run: python -m py_compile app.py train.py src/*.py data/*.py scripts/*.py
