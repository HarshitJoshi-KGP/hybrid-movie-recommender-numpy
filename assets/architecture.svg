<svg viewBox="0 0 980 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <style>
    .box { fill: #ffffff; stroke: #333333; stroke-width: 1.5; rx: 8; }
    .offline { fill: #eaf2fb; stroke: #2b6cb0; }
    .online { fill: #eafbea; stroke: #2f855a; }
    .frontend { fill: #fdf6e3; stroke: #b7791f; }
    .label { font-size: 13px; fill: #1a1a1a; }
    .title { font-size: 15px; font-weight: 600; fill: #111111; }
    .section { font-size: 12px; font-weight: 700; fill: #444444; letter-spacing: 1px; }
    .arrow { stroke: #555555; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  </style>

  <text x="20" y="28" class="section">OFFLINE (batch)</text>
  <rect x="20" y="40" width="270" height="380" fill="#f7fafc" stroke="#cbd5e0" rx="10"/>

  <rect x="45" y="65" width="220" height="55" class="box offline"/>
  <text x="60" y="88" class="title">data/preprocess.py</text>
  <text x="60" y="106" class="label">Download MovieLens 100K,</text>
  <text x="60" y="120" class="label" dy="-2">build ratings/movies parquet</text>

  <line x1="155" y1="120" x2="155" y2="150" class="arrow"/>

  <rect x="45" y="150" width="220" height="55" class="box offline"/>
  <text x="60" y="173" class="title">src/model.py</text>
  <text x="60" y="191" class="label">MatrixFactorizationSGD</text>
  <text x="60" y="205" class="label" dy="-2">(biases + latent factors)</text>

  <line x1="155" y1="205" x2="155" y2="235" class="arrow"/>

  <rect x="45" y="235" width="220" height="55" class="box offline"/>
  <text x="60" y="258" class="title">train.py</text>
  <text x="60" y="276" class="label">Fits MF, saves</text>
  <text x="60" y="290" class="label" dy="-2">src/mf_model.pkl</text>

  <line x1="155" y1="290" x2="155" y2="320" class="arrow"/>

  <rect x="45" y="320" width="220" height="55" class="box offline"/>
  <text x="60" y="343" class="title">src/content_based.py</text>
  <text x="60" y="361" class="label">Genre + year item profiles</text>
  <text x="60" y="375" class="label" dy="-2">(cosine similarity)</text>

  <text x="330" y="28" class="section">ONLINE (serving)</text>
  <rect x="330" y="40" width="300" height="380" fill="#f7fafc" stroke="#cbd5e0" rx="10"/>

  <rect x="355" y="150" width="250" height="65" class="box online"/>
  <text x="370" y="176" class="title">src/hybrid.py</text>
  <text x="370" y="194" class="label">Confidence-weighted blend +</text>
  <text x="370" y="208" class="label" dy="-2">cold-start fallback</text>

  <line x1="480" y1="215" x2="480" y2="245" class="arrow"/>

  <rect x="355" y="245" width="250" height="65" class="box online"/>
  <text x="370" y="271" class="title">src/api.py (FastAPI)</text>
  <text x="370" y="289" class="label">/recommend/{user_id}</text>
  <text x="370" y="303" class="label" dy="-2">in-memory response cache</text>

  <line x1="290" y1="177" x2="350" y2="177" class="arrow"/>
  <line x1="290" y1="347" x2="350" y2="277" class="arrow"/>

  <text x="700" y="28" class="section">FRONTEND</text>
  <rect x="700" y="40" width="250" height="380" fill="#f7fafc" stroke="#cbd5e0" rx="10"/>

  <rect x="720" y="195" width="210" height="65" class="box frontend"/>
  <text x="735" y="221" class="title">app.py (Streamlit)</text>
  <text x="735" y="239" class="label">User picks user_id / top-K,</text>
  <text x="735" y="253" class="label" dy="-2">calls the API, renders results</text>

  <line x1="605" y1="277" x2="715" y2="227" class="arrow"/>
  <line x1="715" y1="245" x2="605" y2="290" class="arrow"/>

  <text x="20" y="450" font-size="11" fill="#666666">Hand-authored architecture diagram -- see README "Architecture" section for details.</text>
</svg>
